coverage:
  status:
    # The project floor is the real gate.
    project:
      default:
        target: 95%
        threshold: 1%
    # A patch can legitimately touch defensive/serve lines that are left
    # uncovered on purpose, and those few lines swing a small diff's percentage
    # a lot. Report patch coverage but do not fail the check on it.
    patch:
      default:
        informational: true

ignore:
  - "cmd/ddmcproxy/main.go"
